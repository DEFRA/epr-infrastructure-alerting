    displayName: Validate & What-If
    jobs:
      - job: Validate_DEV1
        displayName: DEV1 Valid
        pool: $(poolNONPROD)
        steps:
          - template: templates/validate-and-whatif.yaml
            parameters:
              adoEnvironment: DEV1
              bicepParameters: dev1.bicepparam
              connectedServiceNameARM: $(serviceNameARMDEV1)
              resourceGroupName: DEVRWDINFRG1401

