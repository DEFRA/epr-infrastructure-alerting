trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  poolNONPROD: DEFRA-COMMON-UBUNTU-SSV3
  poolPROD: DEFRA-COMMON-UBUNTU-SSV5
  serviceNameARMDEV1: AZD-RWD-DEV1
  serviceNameARMTST1: AZD-RWD-TST1
  serviceNameARMPRE1: AZR-RWD-PRE1
  serviceNameARMPRE2: AZR-RWD-PRE2
  serviceNameARMPRD1: AZR-RWD-PRD1

stages:
